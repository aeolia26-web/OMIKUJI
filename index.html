<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸せおみくじ</title>

  <!-- noteのカード用設定（OGPタグ） -->
  <meta property="og:title" content="幸せおみくじ">
  <meta property="og:description" content="毎日引ける幸せおみくじ。今日のラッキーアイテムを確認しよう！">
  <meta property="og:image" content="https://aeolia26-web.github.io/OMIKUJI/omikujicard2.jpg">
<meta property="og:url" content="https://aeolia26-web.github.io/OMIKUJI/">
  <meta name="twitter:card" content="summary_large_image">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 25px 16px;
      font-family: sans-serif;
      background: #fff0f0;
      color: #493b30;
      text-align: center;
    }

    .container {
      max-width: 460px;
      margin: 15px auto;
      padding: 28px 18px;
      background: #fffdfb;
      border: 2px solid #f2c9ce;
      border-radius: 22px;
      box-shadow: 0 5px 20px #00000012;
    }

    h1 {
      color: #d86d79;
      font-size: 28px;
      margin: 8px 0;
    }

    .subtitle {
      color: #b88c91;
      letter-spacing: 3px;
      font-size: 12px;
    }

    .sakura {
      font-size: 25px;
      margin: 10px;
    }

    .date {
      margin: 18px 0;
      color: #9b777d;
      font-size: 14px;
    }

    .message {
      line-height: 1.9;
      color: #796858;
    }

    button {
      border: none;
      border-radius: 30px;
      padding: 16px 32px;
      margin: 20px 0;
      background: #e47782;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 3px 8px #00000015;
    }

    button:active {
      transform: scale(0.97);
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    .result {
      display:none;
      margin-top: 18px;
      padding: 25px 15px;
      background: #fff0f2;
      border: 1px solid #f0c6cd;
      border-radius: 18px;
      line-height: 1.9;
      box-shadow: 0 4px 12px #0000000a;
      perspective: 800px;
    }

    .card-inner {
      min-height: 160px;
      transition: transform 0.6s ease;
      transform-style: preserve-3d;
    }

    .card-inner.flipping {
      animation: flip 0.8s ease;
    }

    @keyframes flip {
      0% { transform: rotateY(0deg); }
      45% { transform: rotateY(90deg); }
      100% { transform: rotateY(0deg); }
    }

    .card-back {
      min-height: 160px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #ffffff;
      border: 2px solid #edc2ca;
      border-radius: 15px;
      padding: 20px 10px;
    }

    .card-back .question {
      font-size: 48px;
      color: #e47782;
      font-weight: bold;
    }

    .card-back p {
      color: #aa858a;
      font-size: 14px;
    }

    .card-front {
      display: none;
      background: #ffffff;
      border: 2px solid #edc2ca;
      border-radius: 15px;
      padding: 20px 12px;
      animation: appear 0.5s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .fortune {
      font-size: 42px;
      color: #d86d79;
      font-weight: bold;
      margin: 10px;
    }

    #comment {
      color: #796858;
      line-height: 2;
      margin: 12px 0;
    }

    .detail {
      text-align: left;
      margin-top: 20px;
      padding: 15px;
      background: #fff5f1;
      border-radius: 12px;
      line-height: 2.2;
      font-size: 14px;
    }

    .footer {
      font-size: 12px;
      color: #b99b9e;
      margin-top: 25px;
    }

    .shaking {
      animation: shake 0.25s infinite;
    }

    @keyframes shake {
      0%,100% { transform: rotate(0); }
      25% { transform: rotate(-8deg); }
      50% { transform: rotate(8deg); }
      75% { transform: rotate(-5deg); }
    }
  </style>
</head>

<body>

<div class="container">
  <div class="subtitle">TODAY'S FORTUNE</div>
  <div class="sakura">🌸 🌸 🌸</div>
  <h1>幸せおみくじ</h1>
  <div class="date" id="date"></div>
  <div class="sakura">⛩️</div>

    <p class="message" id="message">
    今日のあなたに、<br>
    幸せが訪れますように。
  </p>

  <button id="drawButton" onclick="drawFortune()">
    おみくじを引く ✨
  </button>

  <div class="result">
    <div class="card-inner" id="cardInner">
      <div class="card-back" id="cardBack">
        <div class="question">？？？</div>
        <p>今日のあなたの運勢は…</p>
        <div>🌸 幸せを引き寄せよう 🌸</div>
      </div>

      <div class="card-front" id="cardFront">
        <div>今日のあなたの運勢は…</div>
        <div class="fortune" id="fortune"></div>
        <p id="comment"></p>
        <div class="detail">
          🎨 ラッキーカラー：<span id="color"></span><br>
          🎁 ラッキーアイテム：<span id="item"></span><br>
          🌸 今日の開運アクション：<span id="action"></span>
        </div>
      </div>
    </div>
  </div>
 
 

  <div class="footer">
    あなたの今日が素敵な一日になりますように。
  </div>
</div>

<script>

  { name:"大吉", comment:"思いがけない嬉しい知らせが届くかも。笑顔でいると運気がさらに上昇します。", color:"オレンジ", item:"明るい色の小物", action:"感謝の気持ちを言葉にして伝えてみよう" },

  { name:"中吉", comment:"焦らず一歩ずつ進めば大丈夫。周囲との協力が幸運を呼びます。", color:"スカイブルー", item:"ケーブルクリップ", action:"誰かに笑顔で挨拶してみよう" },

  { name:"末吉", comment:"今日は無理をしないことが大切。休むことも立派な前進です。", color:"ホワイト", item:"温かい飲み物", action:"深呼吸してゆっくり過ごそう" },
  { name:"凶", comment:"少し空回りしやすい日。大きな決断は明日に回して、のんびり構えて。", color:"グレー", item:"マウス", action:"早めにお風呂に入って今日は早く休もう" }

function updateDate() {
  const parts = new Intl.DateTimeFormat("ja-JP", {
    timeZone: "Asia/Tokyo",
    year: "numeric",
    month: "numeric",
    day: "numeric",
    weekday: "long"
  }).formatToParts(new Date());

  const getPart = (type) => parts.find(part => part.type === type).value;

  document.getElementById("date").textContent =
    getPart("year") + "年" + getPart("month") + "月" + getPart("day") + "日（" + getPart("weekday") + "）";
}

updateDate();
setInterval(updateDate, 60000);



let drawing = false;

// 直近2回の運勢を記録
let recentFortunes = [];

const fortuneWeights = {
  "大吉": 15,
  "中吉": 28,
  "吉": 48,
  "末吉": 5,
  "凶": 4
};

function pickFortune() {
  const total = Object.values(fortuneWeights)
    .reduce((a, b) => a + b, 0);

  let result;
  let attempts = 0;

  do {
    let r = Math.random() * total;
    let chosenName = null;

    for (const name in fortuneWeights) {
      r -= fortuneWeights[name];

      if (r < 0) {
        chosenName = name;
        break;
      }
    }

    const candidates = fortunes.filter(
      f => f.name === chosenName
    );

    result = candidates[
      Math.floor(Math.random() * candidates.length)
    ];

    attempts++;

  } while (
    recentFortunes.length >= 2 &&
    recentFortunes[0] === result.name &&
    recentFortunes[1] === result.name &&
    attempts < 100
  );

  recentFortunes.push(result.name);

  if (recentFortunes.length > 2) {
    recentFortunes.shift();
  }

  return result;
}


function drawFortune() {
  if (drawing) return;
  drawing = true;

  const button = document.getElementById("drawButton");
  const shrine = document.querySelectorAll(".sakura")[1];
  const message = document.getElementById("message");
  const cardInner = document.getElementById("cardInner");
  const cardBack = document.getElementById("cardBack");
  const cardFront = document.getElementById("cardFront");

  button.disabled = true;
  button.textContent = "運勢を占っています…";

  cardFront.style.display = "none";
  cardBack.style.display = "flex";

  cardInner.classList.remove("flipping");
  void cardInner.offsetWidth;
  cardInner.classList.add("flipping");

  shrine.classList.add("shaking");
  message.textContent = "幸せのおみくじを引いています…";

  document.querySelector(".result").style.display = "block";

  setTimeout(() => {
    const result = pickFortune();

    document.getElementById("fortune").textContent = result.name;
    document.getElementById("comment").textContent = result.comment;
    document.getElementById("color").textContent = result.color;
    document.getElementById("item").textContent = result.item;
    document.getElementById("action").textContent = result.action;

    cardBack.style.display = "none";
    cardFront.style.display = "block";

    cardInner.classList.remove("flipping");
    shrine.classList.remove("shaking");

    message.innerHTML = "今日のあなたに、<br>幸せが訪れますように。";

    button.disabled = false;
    button.textContent = "もう一度引く ✨";

    drawing = false;

    cardFront.scrollIntoView({
      behavior: "smooth",
      block: "nearest"
    });
  }, 800);
}

</script>
</body>
</html>
